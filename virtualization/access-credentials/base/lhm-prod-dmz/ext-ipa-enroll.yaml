---
# IPA enrollment userData for KubeVirt VMs (External Secret → Doppler).
# The full rendered cloud-config lives in Doppler key IPA_USERDATA
# (principal + password baked in at the source). This avoids ESO
# target templating, which the installed CRD schema does not declare.
# Target Secret `ipa-enroll-userdata` carries the `userData` key,
# consumed via volumes.cloudInitNoCloud.secretRef.
# Idempotent: installer skipped when /etc/ipa/default.conf exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ext-ipa-enroll
  namespace: lhm-prod-dmz
  annotations:
    argocd.argoproj.io/sync-wave: "15"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-auth-api
  target:
    name: ipa-enroll-userdata
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: userData
      remoteRef:
        key: IPA_USERDATA
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
