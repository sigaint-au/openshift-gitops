apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: lhm-dev-applications
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: quay
            wave: "20"
            namespace: lhm-prod-quay
          - name: openshift-logging
            wave: "20"
            namespace: openshift-logging
  template:
    metadata:
      name: 'app-{{.name}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: applications
      source:
        repoURL: https://github.com/sigaint-au/openshift-gitops
        targetRevision: main
        path: 'applications/{{.name}}/overlays/lhm-dev'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
