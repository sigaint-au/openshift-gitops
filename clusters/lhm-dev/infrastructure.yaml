apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: lhm-dev-infrastructure
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          # Wave -20: node / cluster base config
          - name: openshift-machine-config-operator
            wave: "-20"
          - name: openshift-network-operator
            wave: "-20"
          - name: openshift-node-tuning
            wave: "-20"
          - name: cluster-image-registry-operator
            wave: "-15"
          # Wave -10: secrets and certificates
          - name: openshift-cert-manager-operator
            wave: "-10"
          - name: openshift-external-secrets-operator
            wave: "-10"
          # Wave -5: storage
          - name: local-storage
            wave: "-5"
          - name: openshift-data-foundation-operator
            wave: "-5"
          # Wave 0: cluster operators
          - name: nmstate
            wave: "0"
          - name: metallb-operator
            wave: "0"
          - name: openshift-ingress-operator
            wave: "0"
          - name: openshift-apiserver-operator
            wave: "0"
          - name: openshift-console-operator
            wave: "0"
          - name: openshift-pipelines-operator
            wave: "0"
          - name: openshift-logging-operator
            wave: "0"
          - name: loki-operator
            wave: "0"
          - name: cluster-observability-operator
            wave: "0"
          # Disabled: not yet published in OCP 5.0 certified-operators catalog.
          #- name: cloudnative-pg-operator
          #  wave: "0"
          # Disabled: requires more resources than currently available on dev nodes.
          #- name: quay-operator
          #  wave: "0"
          - name: grafana-operator
            wave: "0"
          - name: node-feature-discovery-operator
            wave: "-5"
          - name: virtualization-operator
            wave: "0"
          # Disabled: not yet published in OCP 5.0 certified-operators catalog.
          #- name: nvidia-gpu-operator
          #  wave: "5"
          - name: kube-descheduler-operator
            wave: "5"
          # Disabled: requires more resources than currently available on dev nodes.
          #- name: openshift-service-mesh
          #  wave: "0"
          #- name: kiali-operator
          #  wave: "5"
          - name: compliance-operator
            wave: "0"
          # Deprecated upstream: Container Security Operator is retired, do not re-enable.
          #- name: container-security-operator
          #  wave: "0"
          - name: advanced-cluster-security-operator
            wave: "10"
  template:
    metadata:
      name: 'infra-{{.name}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: infrastructure
      source:
        repoURL: https://github.com/sigaint-au/openshift-gitops
        targetRevision: main
        path: 'infrastructure/{{.name}}/overlays/lhm-dev'
      destination:
        server: https://kubernetes.default.svc
      ignoreDifferences:
        # virt-platform-autopilot owns these specs (platform.kubevirt.io/managed-by).
        # Argo ensures the CR exists; autopilot manages fields. Stops selfHeal flap.
        - group: operator.openshift.io
          kind: KubeDescheduler
          name: cluster
          namespace: openshift-kube-descheduler-operator
          jsonPointers:
            - /spec
        - group: hco.kubevirt.io
          kind: HyperConverged
          name: kubevirt-hyperconverged
          namespace: openshift-cnv
          jsonPointers:
            - /spec
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
