---
# AppProjects for the lhm-prod cluster Argo CD (OpenShift GitOps).
# Each cluster has its own Argo CD; apply only this directory on lhm-prod.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infrastructure
  namespace: openshift-gitops
spec:
  description: Hub cluster operators and platform configuration
  sourceRepos:
    - https://github.com/sigaint-au/openshift-gitops
    - https://github.com/redhat-cop/gitops-catalog
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  orphanedResources:
    warn: true
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: virtualization
  namespace: openshift-gitops
spec:
  description: OpenShift Virtualization workloads and multi-network config
  sourceRepos:
    - https://github.com/sigaint-au/openshift-gitops
  destinations:
    # Virt / shared workload namespaces: lhm-<env>-<role> (e.g. lhm-prod-dmz, lhm-dev-vmnet)
    - namespace: 'lhm-*'
      server: https://kubernetes.default.svc
    # Secondary-net workload namespaces (NAD stamped copies)
    - namespace: 'ocp-*'
      server: https://kubernetes.default.svc
    - namespace: default
      server: https://kubernetes.default.svc
    - namespace: openshift-cnv
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: k8s.cni.cncf.io
      kind: NetworkAttachmentDefinition
    - group: nmstate.io
      kind: NodeNetworkConfigurationPolicy
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  orphanedResources:
    warn: true
