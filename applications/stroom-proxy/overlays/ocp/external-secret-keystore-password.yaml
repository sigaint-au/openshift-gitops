apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ext-stroom-proxy-keystore-password
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-auth-api
  target:
    name: stroom-proxy-keystore-password
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: STROOM_PROXY_KEYSTORE_PASSWORD
