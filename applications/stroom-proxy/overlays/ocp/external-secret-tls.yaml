# TLS material for Stroom Proxy (server keystore + truststore init).
# Doppler keys must supply PEM material; ca.crt is required by the chart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ext-stroom-proxy-tls
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-auth-api
  target:
    name: stroom-proxy-tls
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .tlscrt }}"
        tls.key: "{{ .tlskey }}"
        ca.crt: "{{ .cacrt }}"
  data:
    - secretKey: tlscrt
      remoteRef:
        key: STROOM_PROXY_TLS_CRT
    - secretKey: tlskey
      remoteRef:
        key: STROOM_PROXY_TLS_KEY
    - secretKey: cacrt
      remoteRef:
        key: STROOM_PROXY_TLS_CA
