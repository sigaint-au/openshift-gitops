apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No operator-instance-sync-wave: that component forces Issuer after Certificate;
# this app bootstraps a private CA (Issuer → CA cert → CA Issuer → leaf).
namespace: lhm-prod-stroom-proxy
resources:
  - ../../base
  - namespace.yaml
  - certificate.yaml
  - keystore-password-secret.yaml

# kustomize does not apply `namespace:` to resources produced by helmCharts
# (inflation runs after the namespace transformer). Patch helm output explicitly.
patches:
  - target:
      kind: ServiceAccount
      name: stroom-proxy
    patch: |-
      - op: add
        path: /metadata/namespace
        value: lhm-prod-stroom-proxy
  - target:
      kind: ConfigMap
      name: stroom-proxy
    patch: |-
      - op: add
        path: /metadata/namespace
        value: lhm-prod-stroom-proxy
  - target:
      kind: Service
      name: stroom-proxy
    patch: |-
      - op: add
        path: /metadata/namespace
        value: lhm-prod-stroom-proxy
  - target:
      kind: StatefulSet
      name: stroom-proxy
    patch: |-
      - op: add
        path: /metadata/namespace
        value: lhm-prod-stroom-proxy
      # Let OpenShift SCC inject securityContext (chart pins UID 1000)
      - op: remove
        path: /spec/template/spec/securityContext
      - op: remove
        path: /spec/template/spec/containers/0/securityContext
  - target:
      kind: Ingress
      name: stroom-proxy
    patch: |-
      - op: add
        path: /metadata/namespace
        value: lhm-prod-stroom-proxy
