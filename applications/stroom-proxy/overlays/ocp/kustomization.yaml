apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No operator-instance-sync-wave: that component reorders Issuer/Certificate badly.
namespace: lhm-prod-stroom-proxy
resources:
  - ../../base
  - namespace.yaml
  - certificate.yaml
  - keystore-password-secret.yaml

# kustomize does not apply `namespace:` to resources produced by helmCharts
# (inflation runs after the namespace transformer). Patch helm output explicitly.
#
# Sync waves: Namespace -10 → certs/secrets 5–6 → workload 20 so
# Secret stroom-proxy-tls exists before the StatefulSet mounts it.
patches:
  - target:
      kind: ServiceAccount
      name: stroom-proxy
    patch: |-
      - op: add
        path: /metadata/namespace
        value: lhm-prod-stroom-proxy
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "20"
  - target:
      kind: ConfigMap
      name: stroom-proxy
    patch: |-
      - op: add
        path: /metadata/namespace
        value: lhm-prod-stroom-proxy
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "20"
  - target:
      kind: Service
      name: stroom-proxy
    patch: |-
      - op: add
        path: /metadata/namespace
        value: lhm-prod-stroom-proxy
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "20"
  - target:
      kind: StatefulSet
      name: stroom-proxy
    patch: |-
      - op: add
        path: /metadata/namespace
        value: lhm-prod-stroom-proxy
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "20"
      # Let OpenShift SCC inject securityContext (chart pins UID 1000)
      - op: remove
        path: /spec/template/spec/securityContext
      - op: remove
        path: /spec/template/spec/containers/0/securityContext
  - target:
      kind: Ingress
      name: stroom-proxy
    patch: |-
      - op: add
        path: /metadata/namespace
        value: lhm-prod-stroom-proxy
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "20"
