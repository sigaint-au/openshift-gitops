# OpenShift Route (passthrough) — chart Ingress is disabled (nginx-specific).
# Clients connect with TLS end-to-end to the proxy HTTPS port.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: stroom-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    haproxy.router.openshift.io/timeout: 60m
spec:
  host: stroom-proxy.apps.ocp.sigaint.au
  to:
    kind: Service
    name: stroom-proxy
    weight: 100
  port:
    targetPort: https
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
