apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# GCHQ Stroom Proxy chart (image gchq/stroom-proxy) published to Quay.io as OCI.
# Upstream source: https://github.com/gradata-systems/stroom-helm-charts (stroom-proxy 1.2.14 / app v7.10.20)
# Chart: oci://quay.io/sigaint/stroom-proxy:1.2.14 — see README / /tmp/script.sh for helm push.
helmCharts:
  - name: stroom-proxy
    repo: oci://quay.io/sigaint
    version: 1.2.14
    releaseName: stroom-proxy
    namespace: lhm-prod-stroom-proxy
    valuesFile: values.yaml
    includeCRDs: false
