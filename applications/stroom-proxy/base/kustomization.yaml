apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# GCHQ Stroom Proxy chart (image gchq/stroom-proxy) published to internal Quay as OCI.
# Upstream source: https://github.com/gradata-systems/stroom-helm-charts (stroom-proxy 1.2.14 / app v7.10.20)
# See README for packaging and `helm push` to quay.sigaint.au.
helmCharts:
  - name: stroom-proxy
    repo: oci://quay.sigaint.au/sigaint
    version: 1.2.14
    releaseName: stroom-proxy
    namespace: lhm-prod-stroom-proxy
    valuesFile: values.yaml
    includeCRDs: false
