# Final MTU state post-migration: OVN overlay 8900 (machine uplink 9000
# minus 100-byte Geneve overhead). Replaces the transient mtu-migration
# patch (removed once status.clusterNetworkMTU == 8900, 3/3 updated).
apiVersion: operator.openshift.io/v1
kind: Network
metadata:
  name: cluster
spec:
  defaultNetwork:
    ovnKubernetesConfig:
      mtu: 8900
