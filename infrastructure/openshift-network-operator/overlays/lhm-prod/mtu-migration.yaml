# Post-install MTU migration: machine uplink 1500 -> 9000, OVN overlay
# 1400 -> 8900 (9000 minus 100-byte Geneve overhead).
#
# TRANSIENT: remove this patch once status.clusterNetworkMTU == 8900 and
# the final mtu: 8900 is set (step 2). MCO reboots nodes serially.
apiVersion: operator.openshift.io/v1
kind: Network
metadata:
  name: cluster
spec:
  migration:
    mtu:
      machine:
        from: 1500
        to: 9000
      network:
        from: 1400
        to: 8900
