# Managed via Server-Side Apply. Unmanaged fields stay owned by the CNO.
#
# NOTE: cluster MTU intentionally left at CNO default. A previous 8900 setting
# was refused post-install ("cannot change MTU without migration"); 9k jumbo
# needs the documented migration procedure in a maintenance window.
apiVersion: operator.openshift.io/v1
kind: Network
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,RespectIgnoreDifferences=true
spec:
  defaultNetwork:
    ovnKubernetesConfig:
      gatewayConfig:
        # Required for Istio ambient mode and multi-homed / MetalLB forwarding.
        routingViaHost: true
        ipForwarding: Global
