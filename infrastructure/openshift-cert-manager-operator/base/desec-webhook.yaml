---
# cert-manager webhook for deSEC DNS01 challenges
# Source: github.com/pr0ton11/cert-manager-desec-webhook
apiVersion: v1
kind: ServiceAccount
metadata:
  name: desec-webhook
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: desec-webhook
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: desec-webhook:domain-solver
  labels:
    app.kubernetes.io/name: desec-webhook
rules:
  - apiGroups: ["acme.sigaint.au"]
    resources: ["*"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: desec-webhook:domain-solver
  labels:
    app.kubernetes.io/name: desec-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: desec-webhook:domain-solver
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: desec-webhook:auth-delegator
  labels:
    app.kubernetes.io/name: desec-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: desec-webhook
    namespace: cert-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: desec-webhook:secret-reader
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: desec-webhook
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["desec-token"]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: desec-webhook:secret-reader
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: desec-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: desec-webhook:secret-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: desec-webhook
    namespace: cert-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: desec-webhook:auth-reader
  namespace: kube-system
  labels:
    app.kubernetes.io/name: desec-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: desec-webhook
    namespace: cert-manager
---
apiVersion: v1
kind: Service
metadata:
  name: desec-webhook
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: desec-webhook
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: https
      protocol: TCP
      name: https
  selector:
    app.kubernetes.io/name: desec-webhook
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: desec-webhook
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: desec-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: desec-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: desec-webhook
    spec:
      serviceAccountName: desec-webhook
      securityContext:
        fsGroup: 1001
      containers:
        - name: webhook
          image: ghcr.io/pr0ton11/cert-manager-desec-webhook:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
          args:
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
          env:
            - name: GROUP_NAME
              value: acme.sigaint.au
          ports:
            - name: https
              containerPort: 443
              protocol: TCP
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          volumeMounts:
            - name: certs
              mountPath: /tls
              readOnly: true
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: certs
          secret:
            secretName: desec-webhook-tls
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.acme.sigaint.au
  annotations:
    cert-manager.io/inject-ca-from: cert-manager/desec-webhook-tls
  labels:
    app.kubernetes.io/name: desec-webhook
spec:
  group: acme.sigaint.au
  groupPriorityMinimum: 1000
  versionPriority: 15
  service:
    name: desec-webhook
    namespace: cert-manager
  version: v1alpha1
---
# Self-signed issuer for the webhook's serving cert
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: desec-webhook-selfsign
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: desec-webhook
spec:
  selfSigned: {}
---
# CA certificate for the webhook
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: desec-webhook-ca
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: desec-webhook
spec:
  secretName: desec-webhook-ca
  duration: 43800h
  issuerRef:
    name: desec-webhook-selfsign
  commonName: ca.desec-webhook.cert-manager
  isCA: true
---
# Issuer using the CA to issue serving certs
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: desec-webhook-ca-issuer
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: desec-webhook
spec:
  ca:
    secretName: desec-webhook-ca
---
# Serving certificate for the webhook
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: desec-webhook-tls
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: desec-webhook
spec:
  secretName: desec-webhook-tls
  duration: 8760h
  issuerRef:
    name: desec-webhook-ca-issuer
  dnsNames:
    - desec-webhook
    - desec-webhook.cert-manager
    - desec-webhook.cert-manager.svc
