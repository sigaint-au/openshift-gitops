---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: le-staging
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: le-staging-issuer-account-key
    solvers:
      - dns01:
          webhook:
            groupName: acme.sigaint.au
            solverName: desec
            config:
              apiKeySecretRef:
                name: desec-token
                key: token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: le-production
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: le-production-issuer-account-key
    solvers:
      - dns01:
          webhook:
            groupName: acme.sigaint.au
            solverName: desec
            config:
              apiKeySecretRef:
                name: desec-token
                key: token
