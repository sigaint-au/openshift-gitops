apiVersion: ocs.openshift.io/v1
kind: StorageCluster
metadata:
  name: ocs-storagecluster
  namespace: openshift-storage
  annotations:
    cluster.ocs.openshift.io/local-devices: "true"
    uninstall.ocs.openshift.io/cleanup-policy: delete
    uninstall.ocs.openshift.io/mode: graceful
spec:
  monDataDirHostPath: /var/lib/rook
  resourceProfile: lean
  flexibleScaling: true
  managedResources:
    # Propagated to CephCluster; wipe disks reused from a prior Ceph install.
    cephCluster:
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
  storageDeviceSets:
    - name: ocs-deviceset
      # Rook provisions `count` OSDs per node per set (non-portable);
      # sets = replica (3): total = 2 x 3 nodes x 3 = 18 OSDs (6/node, 1 spare disk/node).
      count: 2
      replica: 3
      portable: false
      dataPVCTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 800Gi
          storageClassName: local-block
          volumeMode: Block
      resources:
        requests:
          cpu: 2
          memory: 5Gi
        limits:
          cpu: 4
          memory: 10Gi
  placement:
    all:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/worker
                  operator: Exists
  arbiter: {}
  encryption:
    enable: false
  mirroring: {}